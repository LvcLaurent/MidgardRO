#       ItemId              Item ID.
###########################################################################

Header:
  Type: ATTENDANCE_DB
  Version: 1

# Reign of Midgard: calendrier de connexion quotidienne. Utilise les vrais
# items officiels de la roulette (db/re/item_db_usable.yml ~L1780) plutot
# que des items custom - Gold_Coin (671, script RouletteGold++) et
# Silver_Coin (675, script RouletteSilver++) sont deja reconnus par le
# client (icone/nom corrects), contrairement a nos premiers essais
# (90000-90002, retires - affichaient "Unknown Item", le client a besoin
# d'une ressource dediee pour un item_id totalement nouveau qu'on n'a pas).
# Alternance Argent/Or un jour sur deux (le systeme ne permet qu'un seul
# item par jour, pas deux en meme temps). Motif repete sur le plafond natif
# de 200 jours (src/map/pc.cpp, pc_attendance_counter), periode large (3
# ans) pour que ce plafond limite avant la fenetre de dates.
# Note : le texte "Event period" affiche par le client ne reflete pas ces
# dates Start/End - semble code en dur cote client, pas une ressource qu'on
# a en local (recherche en cours).
