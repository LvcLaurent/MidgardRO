###########################################################################
# Monster Database
###########################################################################
#
# Monster Settings
#
###########################################################################
# - Id                      Monster ID.
#   AegisName               Server name to reference the monster in scripts and lookups, should use no spaces.
#   Name                    Name in English.
#   JapaneseName            Name in Japanese. (Default: 'Name' value)
#   Level                   Level. (Default: 1)
#   Hp                      Total HP. (Default: 1)
#   Sp                      Total SP. (Default: 1)
#   BaseExp                 Base experience gained. (Default: 0)
#   JobExp                  Job experience gained. (Default: 0)
#   MvpExp                  MVP experience gained. (Default: 0)
#   Attack                  Minimum attack in pre-renewal and base attack in renewal. (Default: 0)
#   Attack2                 Maximum attack in pre-renewal and base magic attack in renewal. (Default: 0)
#   Defense                 Physical defense of the monster, reduces melee and ranged physical attack/skill damage. (Default: 0)
#   MagicDefense            Magic defense of the monster, reduces magical skill damage. (Default: 0)
#   Resistance              Physical resistance of the monster, reduces melee and ranged physical attack/skill damage. (Default: 0)
#   MagicResistance         Magic resistance of the monster, reduces magical skill damage. (Default: 0)
#   Str                     Strength which affects attack. (Default: 1)
#   Agi                     Agility which affects flee. (Default: 1)
#   Vit                     Vitality which affects defense. (Default: 1)
#   Int                     Intelligence which affects magic attack. (Default: 1)
#   Dex                     Dexterity which affects hit rate. (Default: 1)
#   Luk                     Luck which affects perfect dodge/lucky flee/perfect flee/lucky dodge rate. (Default: 1)
#   AttackRange             Attack range. (Default: 0)
#   SkillRange              Skill cast range. (Default: 0)
#   ChaseRange              Chase range. (Default: 0)
#   Size                    Size. (Default: Small)
#   Race                    Race. (Default: Formless)
#   RaceGroups:             List of secondary groups the monster may be part of. (Optional)
#     <group>: <value>      Group to toggle.
#   Element                 Element. (Default: Neutral)
#   ElementLevel            Level of element. (Default: 1)
#   WalkSpeed               Walk speed. (Default: DEFAULT_WALK_SPEED)
#   AttackDelay             Attack speed. (Default: 0)
#   AttackMotion            Attack animation speed. (Default: 0)
#   ClientAttackMotion      Client attack speed. (Default: AttackMotion)
#   DamageMotion            Damage animation speed. (Default: 0)
#   DamageTaken             Rate at which the monster will receive incoming damage. (Default: 100)
#   GroupId                 Monster group ID. (Default: 0)
#   Title                   Monster title. (Default: None)
#   Ai                      Aegis monster type AI behavior. (Default: 06)
#   Class                   Aegis monster class. (Default: Normal)
#   Modes:                  List of unique behavior not defined by AI, Class, or Attribute. (Optional)
#     <mode>: <value>       Mode to toggle.
#   MvpDrops:               List of possible MVP prize items. Max of MAX_MVP_DROP. (Optional)
#     - Item                Item name.
#       Rate                Drop rate of item. (Default: 1)
#       RandomOptionGroup   Random Option Group applied to item on drop. (Default: None)
#       Index               Index used for overwriting item. (Optional)
#   Drops:                  List of possible normal item drops. Max of MAX_MOB_DROP. (Optional)
#     - Item                Item name.
#       Rate                Drop rate of item. (Default: 1)
#       StealProtected      If the item is shielded from TF_STEAL. (Default: false)
#       RandomOptionGroup   Random Option Group applied to item on drop. (Default: None)
#       Index               Index used for overwriting item. (Optional)
###########################################################################

Header:
  Type: MOB_DB
  Version: 5

Body:
  # Reign of Midgard: faction-tagged mob clones. Dedicated mob_db entries, one per
  # faction, so each can carry its own "[Ordre]"/"[Forge]" Name prefix.
  # Correction: an earlier version of this comment claimed the "[Ordre]"/"[Forge]"
  # prefix not rendering was a client-side name-caching bug requiring a dedicated
  # Class ID to fix - that diagnosis was wrong. The real cause: every monster()
  # spawn call in raid_faction_prontera.txt passed a hardcoded literal name (e.g.
  # "Poring", "Knight Guardian") as the 4th argument, which always overrides
  # mob_db's Name field (see mob_once_spawn_sub/mob_parse_dataset in mob.cpp).
  # Fixed by passing the literal "--en--" from those calls instead (a sentinel
  # mob_parse_dataset checks for via strcmp - see mob.cpp - that makes it fall
  # back to mob_db's own Name field; an empty string "" does NOT trigger this
  # fallback and instead produces a genuinely blank name, so don't use that).
  # The server DOES transmit mob_db's Name field to the client directly
  # (clif_spawn_unit/clif_name use status_get_name()/md->name) - there is no
  # client-side Class-ID-to-name table for monsters, unlike items/jobs. Dedicated
  # Class IDs are still needed here regardless, simply because two factions need
  # two different Name strings for what would otherwise be the same mob_id. Add
  # one clone pair here (plus an entry in the faction_mob_clones table in
  # atcommand.cpp's spawnfactionmob) per mob type that needs to be spawnable as a
  # faction mob - and remember to pass "" as the monster() name argument wherever
  # you spawn it.
  - Id: 30000
    AegisName: PORING_ORDRE
    Name: "[Ordre] Poring"
    Level: 1
    Hp: 550
    BaseExp: 150
    JobExp: 40
    Attack: 1
    Attack2: 1
    Defense: 2
    MagicDefense: 5
    Str: 6
    Int: 0
    Dex: 6
    Luk: 5
    AttackRange: 1
    SkillRange: 10
    ChaseRange: 12
    Size: Medium
    Race: Plant
    Element: Water
    ElementLevel: 1
    WalkSpeed: 400
    AttackDelay: 1872
    AttackMotion: 672
    ClientAttackMotion: 288
    DamageMotion: 480
    Ai: 02
    Drops:
      - Item: Jellopy
        Index: 0
        Rate: 7000
      - Item: Knife_
        Index: 1
        Rate: 100
      - Item: Sticky_Mucus
        Index: 2
        Rate: 400
      - Item: Apple
        Index: 3
        Rate: 1000
      - Item: Wing_Of_Fly
        Index: 4
        Rate: 500
      - Item: Apple
        Index: 5
        Rate: 150
      - Item: Unripe_Apple
        Index: 6
        Rate: 20
      - Item: Poring_Card
        Index: 7
        Rate: 20
        StealProtected: true
  - Id: 30001
    AegisName: PORING_FORGE
    Name: "[Forge] Poring"
    Level: 1
    Hp: 550
    BaseExp: 150
    JobExp: 40
    Attack: 1
    Attack2: 1
    Defense: 2
    MagicDefense: 5
    Str: 6
    Int: 0
    Dex: 6
    Luk: 5
    AttackRange: 1
    SkillRange: 10
    ChaseRange: 12
    Size: Medium
    Race: Plant
    Element: Water
    ElementLevel: 1
    WalkSpeed: 400
    AttackDelay: 1872
    AttackMotion: 672
    ClientAttackMotion: 288
    DamageMotion: 480
    Ai: 02
    Drops:
      - Item: Jellopy
        Index: 0
        Rate: 7000
      - Item: Knife_
        Index: 1
        Rate: 100
      - Item: Sticky_Mucus
        Index: 2
        Rate: 400
      - Item: Apple
        Index: 3
        Rate: 1000
      - Item: Wing_Of_Fly
        Index: 4
        Rate: 500
      - Item: Apple
        Index: 5
        Rate: 150
      - Item: Unripe_Apple
        Index: 6
        Rate: 20
      - Item: Poring_Card
        Index: 7
        Rate: 20
        StealProtected: true

  # Reign of Midgard: raid de faction sur Prontera. 4 structures a detruire pour
  # capturer la ville - une seule entree par structure (pas de clone par faction,
  # contrairement aux mobs ci-dessus) car leur nom ne change jamais selon qui
  # defend, seul md->faction (pose via setunitdata dans le script du raid) change.
  # Deliberement PAS de Modes IgnoreMagic/Melee/Misc/Ranged ici, contrairement au
  # vrai EMPELIUM (Id 1288) dont ces 4 flags le rendent invulnerable en dehors de la
  # logique WoE native qu'on n'utilise pas - copier ce bloc Modes aurait rendu les
  # structures indestructibles.
