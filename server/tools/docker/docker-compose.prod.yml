services:
    db:
        image: "mariadb:noble"
        container_name: "rathena-db"
        volumes:
            - "rathenadb:/var/lib/mysql" # persist database on the host
            - "../../sql-files/:/docker-entrypoint-initdb.d" # initialize db with ./sql-files
        environment:
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
            MYSQL_DATABASE: ragnarok
            MYSQL_USER: ragnarok
            MYSQL_PASSWORD: ${DB_PASSWORD}
        restart: unless-stopped

    login:
        build:
            context: ../..
            dockerfile: tools/docker/Dockerfile.prod
        image: "rathena-midgardro:prod"
        container_name: "rathena-login"
        command: sh -c "/bin/wait-for db:3306 -- /rathena/login-server"
        ports:
            - "16900:16900" # login server
        volumes:
            - "./asset-prod/inter_conf.txt:/rathena/conf/import/inter_conf.txt"
            - "./asset-prod/char_conf.txt:/rathena/conf/import/char_conf.txt"
            - "./asset-prod/map_conf.txt:/rathena/conf/import/map_conf.txt"
            - "./asset-prod/login_conf.txt:/rathena/conf/import/login_conf.txt"
        restart: unless-stopped
        depends_on:
            - db

    char:
        build:
            context: ../..
            dockerfile: tools/docker/Dockerfile.prod
        image: "rathena-midgardro:prod"
        container_name: "rathena-char"
        command: sh -c "/bin/wait-for db:3306 -- /rathena/char-server"
        ports:
            - "16121:16121" # char server
        volumes:
            - "./asset-prod/inter_conf.txt:/rathena/conf/import/inter_conf.txt"
            - "./asset-prod/char_conf.txt:/rathena/conf/import/char_conf.txt"
            - "./asset-prod/map_conf.txt:/rathena/conf/import/map_conf.txt"
            - "./asset-prod/login_conf.txt:/rathena/conf/import/login_conf.txt"
        restart: unless-stopped
        depends_on:
            - login

    map:
        build:
            context: ../..
            dockerfile: tools/docker/Dockerfile.prod
        image: "rathena-midgardro:prod"
        container_name: "rathena-map"
        command: sh -c "/bin/wait-for db:3306 -- /rathena/map-server"
        ports:
            - "5121:5121" # map server
        volumes:
            - "./asset-prod/inter_conf.txt:/rathena/conf/import/inter_conf.txt"
            - "./asset-prod/char_conf.txt:/rathena/conf/import/char_conf.txt"
            - "./asset-prod/map_conf.txt:/rathena/conf/import/map_conf.txt"
            - "./asset-prod/login_conf.txt:/rathena/conf/import/login_conf.txt"
        restart: unless-stopped
        depends_on:
            - char

volumes:
    rathenadb:
