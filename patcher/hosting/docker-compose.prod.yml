services:
    patcher-hosting:
        image: nginx:alpine
        container_name: "reign-patcher"
        ports:
            - "8081:8081"
        volumes:
            - ./nginx.conf:/etc/nginx/nginx.conf:ro
            - ./ui:/usr/share/nginx/html/ui:ro
            - ./patches:/usr/share/nginx/html/patches
        networks:
            - rathena_net
        restart: unless-stopped

networks:
    rathena_net:
        name: docker_default
        external: true
