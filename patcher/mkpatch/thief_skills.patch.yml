# Patch : traduction française des 10 compétences du métier Voleur (TF_*) -
# noms courts (skillinfolist.lub) et descriptions complètes (skilldescript.lub).
# Suite du chantier de traduction des compétences (NV_BASIC/patch #3, 10
# premières Novice/Épéiste/Mage/patch #8, 11 Marchand/patch #15).
# Invocation (depuis la racine du repo) :
#   patcher/dist/thorgen.exe -p Client_Reign/reign_GRF -o patcher/hosting/patches/data/19_thief_skills.thor patcher/mkpatch/thief_skills.patch.yml
# (thorgen.exe = mkpatch, renommé pour éviter l'élévation UAC automatique de Windows
# sur tout exécutable dont le nom contient "patch" - voir patcher/dist/)
use_grf_merging: true
target_grf_name: reign.grf
include_checksums: true

entries:
  - relative_path: data/luafiles514/lua files/skillinfoz/skilldescript.lub
  - relative_path: data/luafiles514/lua files/skillinfoz/skillinfolist.lub
