# Patch : ajoute les quêtes 91203-91205 (chaîne des catacombes du Village
# Archer, Vigdis) au journal de quêtes du client - oubliées lors de l'ajout
# du contenu Village Archer, symptôme "Unknown Quest" + compteur incohérent
# côté client.
# Invocation (depuis la racine du repo) :
#   patcher/dist/thorgen.exe -p Client_Reign -o patcher/hosting/patches/data/16_catacombes_quests.thor patcher/mkpatch/catacombes_quests.patch.yml
# (thorgen.exe = mkpatch, renommé pour éviter l'élévation UAC automatique de Windows
# sur tout exécutable dont le nom contient "patch" - voir patcher/dist/)
use_grf_merging: false
include_checksums: true

entries:
  - relative_path: System/OngoingQuestInfoList_True_EN.lub
