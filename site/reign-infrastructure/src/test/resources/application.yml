spring:
  profiles:
    active: test
  main:
    banner-mode: 'off'
  datasource:
    url: jdbc:h2:mem:reign;MODE=MariaDB;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
  sql:
    init:
      mode: always
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none
    mapping-resources:
      - META-INF/account.orm.xml
      - META-INF/character.orm.xml
    open-in-view: false