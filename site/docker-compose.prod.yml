services:
    reign-site:
        build:
            context: .
            dockerfile: Dockerfile.prod
        image: "reign-site:prod"
        container_name: "reign-site"
        ports:
            - "8080:8080"
        environment:
            SPRING_PROFILES_ACTIVE: prod
            DB_PASSWORD: ${DB_PASSWORD}
        networks:
            - rathena_net
        restart: unless-stopped

networks:
    rathena_net:
        name: docker_default
        external: true
