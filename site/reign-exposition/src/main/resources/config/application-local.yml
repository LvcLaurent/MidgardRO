server:
  port: 8080
  servlet: 
    context-path: /reign
    
springdoc:
  swagger-ui:
    enabled: true
    
spring:
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher
  debug: false
  datasource:
    url: jdbc:mariadb://127.0.0.1:3306/ragnarok
    username: ragnarok
    password: ragnarok
    driverClassName: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MariaDBDialect

reign:
  zrenderer:
    base-url: http://localhost:11011
    access-token: ${ZRENDERER_TOKEN}
  