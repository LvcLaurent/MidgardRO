server:
  port: 8080
  servlet:
    context-path: /reign

springdoc:
  swagger-ui:
    enabled: false

spring:
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher
  debug: false
  datasource:
    # Pour tester depuis un poste de dev (hors du réseau docker de prod) via un tunnel SSH :
    # plink -ssh -N -L 13306:127.0.0.1:13306 -pw <mdp> <user>@192.168.1.20
    url: jdbc:mariadb://127.0.0.1:13306/ragnarok
    username: ragnarok
    password: ${DB_PASSWORD}
    driverClassName: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MariaDBDialect
