server:
  port: 8080
  servlet:
    context-path: /reign

springdoc:
  swagger-ui:
    enabled: false

spring:
  mvc:
    pathmatch:
      matching-strategy: ant-path-matcher
  debug: false
  datasource:
    # "db" est le nom du service MariaDB sur le réseau docker "docker_default" partagé
    # avec la stack rAthena - cette appli doit tourner sur ce même réseau docker.
    url: jdbc:mariadb://db:3306/ragnarok
    username: ragnarok
    password: ${DB_PASSWORD}
    driverClassName: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.MariaDBDialect

reign:
  zrenderer:
    # "zrenderer" est le nom du service sur le réseau docker "docker_default" (voir docker-compose.prod.yml)
    base-url: http://zrenderer:11011
    access-token: ${ZRENDERER_TOKEN}
  gameserver:
    # noms de service sur le réseau docker "docker_default", partagé avec la stack rAthena
    login-host: login
    login-port: 16900
    char-host: char
    char-port: 16121
    map-host: map
    map-port: 5121
